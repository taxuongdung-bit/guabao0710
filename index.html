<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#bcefff"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="企鵝單字"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><title>企鵝單字冒險｜英文學習</title><style>:root{font-family:system-ui,'Microsoft JhengHei',sans-serif;color:#35415c}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#c7efff,#eafaff 55%,#d5e9ff);min-height:100vh}.wrap{max-width:960px;margin:auto;padding:24px}header{background:#fff;border:4px solid #fff;border-radius:30px;padding:23px;box-shadow:0 10px 30px #6a9ba633}h1{font-size:clamp(28px,5vw,44px);margin:0;color:#3c72b5}.sub{color:#72809a}nav{display:flex;flex-wrap:wrap;gap:9px;margin:20px 0}button,select,input{font:inherit}button{border:0;border-radius:16px;background:#fff;color:#3c5e89;padding:12px 16px;cursor:pointer;font-weight:750;box-shadow:0 4px 0 #c7d6e6}button:hover{filter:brightness(.97)}button.active,.primary{background:#ffca58;color:#65441a;box-shadow:0 4px 0 #df9e28}.panel{background:#fff;border-radius:28px;padding:24px;box-shadow:0 12px 28px #6a9ba633;min-height:340px}.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}.badge{background:#e9f4ff;padding:9px 13px;border-radius:15px;font-weight:700}.word{font-size:clamp(36px,8vw,64px);font-weight:900;color:#4776c6;overflow-wrap:anywhere;text-align:center;margin:24px 0}.meaning{text-align:center;font-size:26px;color:#e38a3b;font-weight:800}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:20px}.choices button{min-height:75px;font-size:20px;background:#eaf6ff}.choices button:focus-visible,button:focus-visible{outline:3px solid #3263a4}.center{text-align:center}.hint{color:#71809b}.cloze{font-size:clamp(27px,5vw,43px);letter-spacing:4px;white-space:pre-wrap;overflow-wrap:anywhere;text-align:center;color:#4175bd;font-weight:800;margin:22px 0}input{border:2px solid #b7d7f4;border-radius:14px;padding:12px;width:min(100%,380px)}.result{font-size:19px;font-weight:750;min-height:30px;margin:16px 0}.good{color:#238759}.bad{color:#ce5260}table{width:100%;border-collapse:collapse}th,td{padding:12px;border-bottom:1px solid #e6edf5;text-align:left}th{background:#eaf5ff}.scroll{overflow:auto}label{display:inline-flex;align-items:center;gap:7px}.foot{font-size:13px;color:#71809b;margin-top:20px}@media(max-width:500px){.wrap{padding:12px}.panel{padding:17px}.choices{grid-template-columns:1fr}nav button{flex:1 1 43%}}header{position:relative;overflow:hidden;background:linear-gradient(110deg,#fff,#e4f7ff)}header:after{content:"🐧 ❄️ 🐧";position:absolute;right:18px;top:12px;font-size:32px;opacity:.75}.panel{border:3px solid #cceeff}.panel:before{content:"❄️ 🐧 ❄️";display:block;text-align:right;font-size:19px;opacity:.65}.penguin{font-size:65px;text-align:center;margin:8px}.progressbar{height:12px;border-radius:20px;background:#d9eff8;overflow:hidden;margin:14px 0}.progressbar span{display:block;height:100%;background:#5db5dc;transition:width .2s}.choices button:hover{background:#ccefff}@media(max-width:650px){header:after{position:static;display:block;margin-top:8px}} </style></head><body><main class="wrap"><header><h1>🐧 企鵝單字冒險 ❄️</h1><div class="sub">🐧 跟著企鵝在冰雪世界學英文・每回合 10 題！</div><div class="row" style="margin-top:15px"><span class="badge" id="total"></span><span class="badge" id="score"></span><span class="badge" id="mastered"></span></div></header><nav id="nav"></nav><section class="panel" id="app"></section><div class="foot">資料保存在本機瀏覽器。更換瀏覽器、清除網站資料可能遺失紀錄，建議定期匯出備份。語音取決於裝置是否有離線英文語音。</div></main><script>
const initial=[['table','桌子','貼紙貼在桌子上'],['trash can','垃圾桶','trash 垃圾＋can 容器'],['blackboard','黑板','black 黑色＋board 板子'],['telephone','電話','遠方的人也能聽見'],['fan','電風扇','葉片轉呀轉'],['whiteboard','白板','white 白色＋board 板子'],['door','門','開門、關門'],['window','窗戶','風從窗戶吹進來']];
const KEY='kids-vocab-v1';let saved={};try{saved=JSON.parse(localStorage.getItem(KEY)||'{}')}catch{};let words=Array.isArray(saved.words)&&saved.words.length?saved.words:initial.map(([en,zh,hint])=>({en,zh,hint}));let stats=saved.stats||{},high=saved.high||0;let mode='cards',current=null,answer='',count=0,points=0,lives=3,deadline=0,timer=null,previousMask={};function persist(){try{localStorage.setItem(KEY,JSON.stringify({words,stats,high}))}catch{}}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function sample(a){return a[Math.floor(Math.random()*a.length)]}function getStat(w){return stats[w.en]||(stats[w.en]={right:0,wrong:0})}function update(){document.querySelector('#total').textContent='📚 '+words.length+' 個單字';document.querySelector('#score').textContent='🏆 最高分 '+high;document.querySelector('#mastered').textContent='⭐ 熟悉 '+words.filter(w=>getStat(w).right>=3&&getStat(w).right>getStat(w).wrong).length+' 個'}function speak(t){if(!('speechSynthesis'in window)){alert('此裝置不支援語音朗讀');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=.78;speechSynthesis.speak(u)}function pick(){let pool=words.flatMap(w=>Array(Math.max(1,4-Math.min(3,getStat(w).right)+Math.min(3,getStat(w).wrong))).fill(w));let p=sample(pool);if(words.length>1&&current&&p.en===current.en){let other=pool.filter(w=>w.en!==current.en);p=sample(other)}current=p;return p}function record(ok){let s=getStat(current);s[ok?'right':'wrong']++;if(ok)points+=10;else if(mode==='lives')lives--;high=Math.max(high,points);persist();update()}function header(t){return `<div class="row"><h2 style="margin:0;flex:1">${t}</h2><span class="badge">🐧 ${Math.min(count,10)}/10 題</span><span class="badge">🌟 ${points} 分</span>${mode==='lives'?`<span class="badge">❤️ ${lives} 命</span>`:''}${mode==='speed'?`<span class="badge" id="clock">⏱️ ${Math.max(0,Math.ceil((deadline-Date.now())/1000))} 秒</span>`:''}</div><div class="progressbar"><span style="width:${Math.min(count,10)*10}%"></span></div>`}function view(html){document.querySelector('#app').innerHTML=html}function feedback(ok,msg){let el=document.querySelector('#feedback');if(el){el.className='result '+(ok?'good':'bad');el.textContent=msg}}function nextButton(){return `<button class="primary" onclick="round()">${count>=10?"查看成績 🏆":"下一題 ➜"}</button>`}function finish(){clearInterval(timer);view(header('🎉 挑戰完成')+`<div class="penguin">🐧🏆❄️</div><div class="word">${points} 分！</div><p class="center">本回合完成 ${Math.min(count,10)} / 10 題，繼續練習會更厲害！</p><div class="center"><button class="primary" onclick="start('${mode}')">再玩一次</button></div>`)}function start(m){clearInterval(timer);mode=m;points=0;lives=3;count=0;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.mode===m));if(m==='speed'){deadline=Date.now()+60000;timer=setInterval(()=>{let c=document.querySelector('#clock');if(c)c.textContent='⏱️ '+Math.max(0,Math.ceil((deadline-Date.now())/1000))+' 秒';if(Date.now()>=deadline)finish()},200)}round()}function round(){if(count>=10&&!['table','manage','progress'].includes(mode))return finish();if(mode==='speed'&&Date.now()>=deadline)return finish();if(mode==='lives'&&lives<=0)return finish();if(mode==='table')return table();if(mode==='manage')return manage();if(mode==='progress')return progress();if(mode==='review'){let missed=words.filter(w=>getStat(w).wrong>0);if(!missed.length)return view(header('🔁 錯題複習')+'<p>目前沒有錯題，太棒了！先去挑戰其他模式吧。</p>');current=sample(missed);count++;return choice(true)}pick();count++;if(mode==='cards')return cards();if(mode==='cloze')return cloze();if(mode==='spelling')return spelling();if(mode==='listening')return choice(false,true);choice(mode==='zh-en')}
function cards(){view(header('📖 單字翻翻卡')+`<div class="penguin">🐧</div><div class="word" id="cardword">${current.en}</div><div class="meaning" id="cardmeaning">點一下「翻面」看中文</div><div class="center row" style="justify-content:center"><button onclick="speak(current.en)">🔊 聽發音</button><button class="primary" onclick="document.querySelector('#cardmeaning').textContent=current.zh+'｜'+current.hint">🔄 翻面</button><button onclick="round()">${count>=10?"完成本回合 🏆":"下一張 ➜"}</button></div>`)}function choice(reverse=false,listen=false){let correct=reverse?current.en:current.zh;let distract=shuffle(words.filter(w=>w.en!==current.en)).slice(0,3).map(w=>reverse?w.en:w.zh);let opts=shuffle([correct,...distract]);let title=listen?'🔊 聽力挑戰':reverse?'🟡 中文猜英文':'🎯 四選一挑戰';let question=listen?'<button class="primary" onclick="speak(current.en)">🔊 播放英文發音</button>':`<div class="word">${reverse?current.zh:current.en}</div>`;view(header(title)+`<div class="center">${question}</div><div class="choices">${opts.map((o,i)=>`<button data-opt="${i}" onclick="checkChoice(${i})">${o}</button>`).join('')}</div><div id="feedback" class="result center"></div><div class="center" id="next"></div>`);window.choiceCorrect=correct;window.choiceOptions=opts;if(listen)speak(current.en)}function checkChoice(i){let ok=choiceOptions[i]===choiceCorrect;record(ok);feedback(ok,ok?'🎉 答對了！':'💡 正確答案：'+choiceCorrect);document.querySelectorAll('[data-opt]').forEach(b=>b.disabled=true);document.querySelector('#next').innerHTML=nextButton()}
function maskFor(w){let indices=[...w.en].map((c,i)=>/[a-z]/i.test(c)?i:-1).filter(i=>i>=0);let ratio=Number(document.querySelector('#difficulty')?.value||.5);let n=Math.max(1,Math.min(indices.length,Math.round(indices.length*ratio)));let masks=[];for(let j=0;j<12;j++){let candidate=shuffle(indices).slice(0,n).sort((a,b)=>a-b);if(candidate.join(',')!==previousMask[w.en]||indices.length===1){masks=candidate;break}}if(!masks.length)masks=shuffle(indices).slice(0,n);previousMask[w.en]=masks.join(',');return masks}
let hidden=[];function cloze(){let difficulty=Number(sessionStorage.getItem('diff')||.5);view(header('🧩 隨機克漏字')+`<div class="row"><label>難度 <select id="difficulty" onchange="sessionStorage.setItem('diff',this.value);cloze()"><option value="0.25">簡單 25%</option><option value="0.5">普通 50%</option><option value="0.75">困難 75%</option><option value="1">大師 100%</option></select></label><button onclick="speak(current.en)">🔊 發音</button></div><div class="meaning">${current.zh}</div><div id="mask" class="cloze"></div><div class="center"><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="依序輸入缺少的字母" aria-label="缺少的字母"><div style="margin-top:12px"><button class="primary" onclick="checkText('cloze')">確認答案</button> <button onclick="cloze()">🎲 重新挖空</button></div><div id="feedback" class="result"></div><div id="next"></div></div>`);document.querySelector('#difficulty').value=difficulty;hidden=maskFor(current);document.querySelector('#mask').textContent=[...current.en].map((c,i)=>hidden.includes(i)?'_':c).join(' ');document.querySelector('#typed').focus();document.querySelector('#typed').onkeydown=e=>{if(e.key==='Enter')checkText('cloze')}}function spelling(){view(header('✏️ 完整拼字')+`<div class="meaning">${current.zh}</div><div class="center" style="margin-top:25px"><button onclick="speak(current.en)">🔊 聽發音</button><p><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入完整英文"></p><button class="primary" onclick="checkText('spelling')">確認答案</button><div id="feedback" class="result"></div><div id="next"></div></div>`);document.querySelector('#typed').focus();document.querySelector('#typed').onkeydown=e=>{if(e.key==='Enter')checkText('spelling')}}function checkText(type){let el=document.querySelector('#typed');if(el.disabled)return;let expected=type==='cloze'?hidden.map(i=>current.en[i]).join(''):current.en;let got=el.value.trim().toLowerCase().replace(/\s+/g,' ');if(!got)return feedback(false,'請先輸入答案');let ok=got===expected.toLowerCase();record(ok);feedback(ok,' '+(ok?'🎉 答對了！':'💡 正確答案：'+expected)+'　完整單字：'+current.en);el.disabled=true;document.querySelector('#next').innerHTML=nextButton()}
function table(){view(`<h2>📚 中英文單字對照表</h2><div class="scroll"><table><thead><tr><th>#</th><th>英文</th><th>繁體中文</th><th>朗讀</th><th>記憶提示</th></tr></thead><tbody>${words.map((w,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(w.en)}</td><td>${escapeHtml(w.zh)}</td><td><button onclick="speak(words[${i}].en)">🔊</button></td><td>${escapeHtml(w.hint||'')}</td></tr>`).join('')}</tbody></table></div>`)}function progress(){view(`<h2>📊 學習成果</h2><div class="scroll"><table><tr><th>單字</th><th>答對</th><th>答錯</th><th>熟悉程度</th></tr>${words.map(w=>{let s=getStat(w);return `<tr><td>${escapeHtml(w.en)}</td><td>${s.right}</td><td>${s.wrong}</td><td>${s.right>=3&&s.right>s.wrong?'⭐ 已熟悉':s.right?'🟡 練習中':'🔴 待練習'}</td></tr>`}).join('')}</table></div><p><button onclick="exportData()">💾 匯出進度備份</button></p>`)}function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function manage(){view(`<h2>➕ 新增單字與備份</h2><p class="hint">每行輸入：英文,中文,記憶提示（記憶提示可省略）</p><textarea id="add" style="width:100%;height:115px;border:2px solid #b7d7f4;border-radius:15px;padding:12px" placeholder="pencil,鉛筆,用鉛筆寫字"></textarea><p><button class="primary" onclick="addWords()">加入題庫</button> <button onclick="exportData()">匯出 JSON 備份</button> <button onclick="exportCsv()">匯出 CSV 對照表</button></p><p><label>匯入先前的 JSON 備份 <input type="file" id="import" accept=".json,application/json" onchange="importData(event)"></label></p><p class="hint">單字與紀錄僅存放在這台裝置的目前瀏覽器中；匯出 JSON 可備份或轉移至其他裝置。</p><div id="feedback" class="result"></div>`)}function addWords(){let raw=document.querySelector('#add').value.split(/\n/);let n=0;for(let line of raw){let [en,zh,...rest]=line.split(',').map(x=>x.trim());if(!en||!zh||!/^[a-zA-Z][a-zA-Z -]*$/.test(en))continue;en=en.toLowerCase();if(words.some(w=>w.en===en))continue;words.push({en,zh,hint:rest.join(',')});n++}persist();update();feedback(true,`成功新增 ${n} 個單字！`)}function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportData(){download('英文單字遊戲備份.json',JSON.stringify({words,stats,high},null,2),'application/json')}function exportCsv(){let lines=[['英文','繁體中文','記憶提示'],...words.map(w=>[w.en,w.zh,w.hint||''])];download('英文單字對照表.csv','\ufeff'+lines.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.words)||!d.words.every(w=>typeof w.en==='string'&&typeof w.zh==='string'))throw Error();if(!confirm('匯入會取代目前的題庫與學習紀錄，確定繼續？'))return;words=d.words;stats=d.stats||{};high=d.high||0;persist();update();manage();feedback(true,'備份匯入成功')}catch{feedback(false,'備份檔格式不正確')}};r.readAsText(f)}
const menus=[['cards','🐧 單字卡'],['choice','🎯 四選一'],['zh-en','🟡 中翻英'],['cloze','🧩 隨機克漏字'],['spelling','✏️ 拼字'],['listening','🔊 聽力'],['speed','⏱️ 60 秒'],['lives','🐧❤️ 三條命'],['review','🔁 錯題'],['table','📚 對照表'],['progress','📊 成果'],['manage','➕ 題庫管理']];document.querySelector('#nav').innerHTML=menus.map(([m,t])=>`<button data-mode="${m}" onclick="start('${m}')">${t}</button>`).join('');update();start('cards');
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
