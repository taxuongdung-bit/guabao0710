function cards(){view(header('📖 單字翻翻卡')+`<div class="penguin">🐧</div><div class="word" id="cardword">${current.en}</div><div class="meaning" id="cardmeaning">點一下「翻面」看中文</div><div class="center row" style="justify-content:center"><button onclick="speak(current.en)">🔊 聽發音</button><button class="primary" onclick="document.querySelector('#cardmeaning').textContent=current.zh+'｜'+current.hint">🔄 翻面</button><button onclick="round()">${count>=10?"完成本回合 🏆":"下一張 ➜"}</button></div>`)}function choice(reverse=false,listen=false){let correct=reverse?current.en:current.zh;let distract=shuffle(words.filter(w=>w.en!==current.en)).slice(0,3).map(w=>reverse?w.en:w.zh);let opts=shuffle([correct,...distract]);let title=listen?'🔊 聽力挑戰':reverse?'🟡 中文猜英文':'🎯 四選一挑戰';let question=listen?'<button class="primary" onclick="speak(current.en)">🔊 播放英文發音</button>':`<div class="word">${reverse?current.zh:current.en}</div>`;view(header(title)+`<div class="center">${question}</div><div class="choices">${opts.map((o,i)=>`<button data-opt="${i}" onclick="checkChoice(${i})">${o}</button>`).join('')}</div><div id="feedback" class="result center"></div><div class="center" id="next"></div>`);window.choiceCorrect=correct;window.choiceOptions=opts;if(listen)speak(current.en)}function checkChoice(i){if(document.querySelector('[data-opt]')?.disabled)return;let ok=choiceOptions[i]===choiceCorrect;record(ok);feedback(ok,ok?'🎉 答對了！':'💡 正確答案：'+choiceCorrect);document.querySelectorAll('[data-opt]').forEach(b=>b.disabled=true);document.querySelector('#next').innerHTML=nextButton()}
function maskFor(w){let indices=[...w.en].map((c,i)=>/[a-z]/i.test(c)?i:-1).filter(i=>i>=0);let ratio=Number(document.querySelector('#difficulty')?.value||.5);let n=Math.max(1,Math.min(indices.length,Math.round(indices.length*ratio)));let masks=[];for(let j=0;j<12;j++){let candidate=shuffle(indices).slice(0,n).sort((a,b)=>a-b);if(candidate.join(',')!==previousMask[w.en]||indices.length===1){masks=candidate;break}}if(!masks.length)masks=shuffle(indices).slice(0,n);previousMask[w.en]=masks.join(',');return masks}
let hidden=[];function cloze(){let difficulty=Number(sessionStorage.getItem('diff')||.5);view(header('🧩 隨機克漏字')+`<div class="row"><label>難度 <select id="difficulty" onchange="sessionStorage.setItem('diff',this.value);cloze()"><option value="0.25">簡單 25%</option><option value="0.5">普通 50%</option><option value="0.75">困難 75%</option><option value="1">大師 100%</option></select></label><button onclick="speak(current.en)">🔊 發音</button></div><div class="meaning">${current.zh}</div><div id="mask" class="cloze"></div><div class="center"><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="依序輸入缺少的字母" aria-label="缺少的字母"><div style="margin-top:12px"><button class="primary" onclick="checkText('cloze')">確認答案</button> <button onclick="cloze()">🎲 重新挖空</button></div><div id="feedback" class="result"></div><div id="next"></div></div>`);document.querySelector('#difficulty').value=difficulty;hidden=maskFor(current);document.querySelector('#mask').textContent=[...current.en].map((c,i)=>hidden.includes(i)?'_':c).join(' ');document.querySelector('#typed').focus();document.querySelector('#typed').onkeydown=e=>{if(e.key==='Enter')checkText('cloze')}}function spelling(){view(header('✏️ 完整拼字')+`<div class="meaning">${current.zh}</div><div class="center" style="margin-top:25px"><button onclick="speak(current.en)">🔊 聽發音</button><p><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="輸入完整英文"></p><button class="primary" onclick="checkText('spelling')">確認答案</button><div id="feedback" class="result"></div><div id="next"></div></div>`);document.querySelector('#typed').focus();document.querySelector('#typed').onkeydown=e=>{if(e.key==='Enter')checkText('spelling')}}function checkText(type){let el=document.querySelector('#typed');if(el.disabled)return;let expected=type==='cloze'?hidden.map(i=>current.en[i]).join(''):current.en;let got=el.value.trim().toLowerCase().replace(/\s+/g,' ');if(!got)return feedback(false,'請先輸入答案');let ok=got===expected.toLowerCase();record(ok);feedback(ok,' '+(ok?'🎉 答對了！':'💡 正確答案：'+expected)+'　完整單字：'+current.en);el.disabled=true;document.querySelector('#next').innerHTML=nextButton()}
function table(){view(`<h2>📚 中英文單字對照表</h2><div class="scroll"><table><thead><tr><th>#</th><th>英文</th><th>繁體中文</th><th>朗讀</th><th>記憶提示</th></tr></thead><tbody>${words.map((w,i)=>`<tr><td>${i+1}</td><td>${escapeHtml(w.en)}</td><td>${escapeHtml(w.zh)}</td><td><button onclick="speak(words[${i}].en)">🔊</button></td><td>${escapeHtml(w.hint||'')}</td></tr>`).join('')}</tbody></table></div>`)}function progress(){view(`<h2>📊 學習成果</h2><div class="scroll"><table><tr><th>單字</th><th>答對</th><th>答錯</th><th>熟悉程度</th></tr>${words.map(w=>{let s=getStat(w);return `<tr><td>${escapeHtml(w.en)}</td><td>${s.right}</td><td>${s.wrong}</td><td>${s.right>=3&&s.right>s.wrong?'⭐ 已熟悉':s.right?'🟡 練習中':'🔴 待練習'}</td></tr>`}).join('')}</table></div><p><button onclick="exportData()">💾 匯出進度備份</button></p>`)}function escapeHtml(t){return String(t).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function manage(){view(`<h2>➕ 新增單字與備份</h2><p class="hint">每行輸入：英文,中文,記憶提示（記憶提示可省略）</p><textarea id="add" style="width:100%;height:115px;border:2px solid #b7d7f4;border-radius:15px;padding:12px" placeholder="pencil,鉛筆,用鉛筆寫字"></textarea><p><button class="primary" onclick="addWords()">加入題庫</button> <button onclick="exportData()">匯出 JSON 備份</button> <button onclick="exportCsv()">匯出 CSV 對照表</button></p><p><label>📥 大量匯入 CSV 題庫 <input type="file" accept=".csv,text/csv" onchange="importCsv(event)"></label></p><p class="hint">CSV 欄位：英文,繁體中文,記憶提示。可從 Excel 另存為 CSV UTF-8。重複英文會自動略過，不會刪除原有進度。</p><p><label>匯入先前的 JSON 備份 <input type="file" id="import" accept=".json,application/json" onchange="importData(event)"></label></p><p class="hint">單字與紀錄僅存放在這台裝置的目前瀏覽器中；匯出 JSON 可備份或轉移至其他裝置。</p><div id="feedback" class="result"></div>`)}function addWords(){let raw=document.querySelector('#add').value.split(/\n/);let n=0;for(let line of raw){let [en,zh,...rest]=line.split(',').map(x=>x.trim());if(!en||!zh||!/^[a-zA-Z][a-zA-Z -]*$/.test(en))continue;en=en.toLowerCase();if(words.some(w=>w.en===en))continue;words.push({en,zh,hint:rest.join(',')});n++}persist();update();categoryPicker();feedback(true,`成功新增 ${n} 個單字！`)}function download(name,content,type){let url=URL.createObjectURL(new Blob([content],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportData(){download('英文單字遊戲備份.json',JSON.stringify({words,stats,high},null,2),'application/json')}function exportCsv(){let lines=[['英文','繁體中文','記憶提示'],...words.map(w=>[w.en,w.zh,w.hint||''])];download('英文單字對照表.csv','\ufeff'+lines.map(row=>row.map(x=>'"'+String(x).replace(/"/g,'""')+'"').join(',')).join('\r\n'),'text/csv;charset=utf-8')}function parseCsv(text){text=text.replace(/^\uFEFF/,'');let rows=[],row=[],field='',quoted=false;for(let i=0;i<text.length;i++){let c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){field+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(field);field=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(field);if(row.some(v=>v.trim()))rows.push(row);row=[];field=''}else field+=c}row.push(field);if(row.some(v=>v.trim()))rows.push(row);return rows}function importCsv(e){let file=e.target.files?.[0];if(!file)return;let reader=new FileReader();reader.onload=()=>{let rows=parseCsv(String(reader.result));let n=0,skipped=0;for(let i=0;i<rows.length;i++){let [en='',zh='',hint='']=rows[i].map(x=>x.trim());if(i===0&&/^(英文|english|en)$/i.test(en))continue;en=en.toLowerCase();if(!en||!zh||!/^[a-z][a-z '-]*$/.test(en)||words.some(w=>w.en===en)){skipped++;continue}words.push({en,zh,hint});n++}persist();update();categoryPicker();manage();feedback(true,`🐧 匯入成功：新增 ${n} 個單字，略過 ${skipped} 筆（重複或格式不符）。`)};reader.readAsText(file,'UTF-8')}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let d=JSON.parse(r.result);if(!Array.isArray(d.words)||!d.words.every(w=>typeof w.en==='string'&&typeof w.zh==='string'))throw Error();if(!confirm('匯入會取代目前的題庫與學習紀錄，確定繼續？'))return;words=d.words;stats=d.stats||{};high=d.high||0;persist();update();manage();feedback(true,'備份匯入成功')}catch{feedback(false,'備份檔格式不正確')}};r.readAsText(f)}
function categoryPicker(){const el=document.getElementById('category-picker');if(!el)return;const categories=['全部單字',...new Set(words.flatMap(w=>(w.category||'').split('／').filter(Boolean)))];el.innerHTML='<label>📚 練習單元： <select id="category-select" onchange="selectedCategory=this.value;start(mode)">'+categories.map(c=>'<option value="'+escapeHtml(c)+'" '+(selectedCategory===c?'selected':'')+'>'+escapeHtml(c)+'</option>').join('')+'</select></label>';}const menus=[['cards','🐧 單字卡'],['choice','🎯 四選一'],['zh-en','🟡 中翻英'],['cloze','🧩 隨機克漏字'],['spelling','✏️ 拼字'],['listening','🔊 聽力'],['speed','⏱️ 60 秒'],['lives','🐧❤️ 三條命'],['review','🔁 錯題'],['table','📚 對照表'],['progress','📊 成果'],['manage','➕ 題庫管理']];document.querySelector('#nav').innerHTML=menus.map(([m,t])=>`<button data-mode="${m}" onclick="start('${m}')">${t}</button>`).join('');update();renderPet();categoryPicker();start('cards');
</script><script>if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
